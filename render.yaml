# Render Blueprint for LINIYA. Add the real key in the Render dashboard only.
services:
  - type: web
    name: liniya-ai
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MAX_DAILY_REQUESTS
        value: '60'
      - key: MAX_DAILY_PER_IP
        value: '20'
      - key: ALLOWED_ORIGINS
        value: https://mk-99Tamirlan.github.io,https://aibekmusabek3-del.github.io
